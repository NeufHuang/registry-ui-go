# All-in-one deployment: Registry UI + Registry v3 in one container.
# Useful for small/self-hosted installs with minimal moving parts.
services:
  registry-ui-aio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: registry-ui-aio
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Optional direct registry port for debugging; Docker CLI can normally use :8080 via /v2 proxy.
      # - "5000:5000"
    environment:
      DEPLOY_MODE: "aio"
      SERVER_ADDR: ":8080"
      AUTH_MODE: "basic"
      V2_AUTH_MODE: "ui"
      ENABLE_DELETE: "true"
      DATA_DIR: "/data"
      SQLITE_PATH: "/data/db/registry-ui.db"
      UPLOAD_DIR: "/data/uploads"
      CERT_DIR: "/data/certs"
      # Do NOT pass REGISTRY_URL / REGISTRY_DATA_DIR / REGISTRY_CONFIG here.
      # In aio mode the distribution registry runs in the same container and
      # maps every REGISTRY_-prefixed variable onto its own config tree, which
      # only produces "Ignoring unrecognized environment variable" warnings and
      # can shadow registry-config.yml. The entrypoint already applies these
      # defaults and hands them to the UI process only. Override them via a
      # mounted /etc/distribution/config.yml instead.
    volumes:
      - ./data:/data
