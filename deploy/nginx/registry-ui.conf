# ---------------------------------------------------------------------------
# Registry UI behind Nginx (TLS terminated by Nginx)
#
#   cp deploy/nginx/registry-ui.conf /etc/nginx/conf.d/registry-ui.conf
#   # set server_name + certificate paths, then:
#   nginx -t && nginx -s reload
#
# Assumptions on the UI side:
#   * HTTPS is switched OFF in the UI (Settings page) so it serves plain HTTP
#   * the UI is published on loopback only, e.g.  ports: ["127.0.0.1:8080:8080"]
# ---------------------------------------------------------------------------

upstream registry_ui {
    server 127.0.0.1:8080;
    keepalive 32;                       # reuse upstream connections (blob traffic)
}

server {
    listen      80;
    listen      [::]:80;
    server_name registry.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;                     # nginx >= 1.25.1; older: listen 443 ssl http2;
    server_name registry.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Image layers are uploaded as one large body. Never cap it, or `docker
    # push` fails with 413 Request Entity Too Large.
    client_max_body_size 0;

    # ---- Docker Registry API ------------------------------------------------
    # Matches /v2 and /v2/... (docker pings /v2/).
    location ~ ^/v2(/|$) {
        proxy_pass http://registry_ui;
        proxy_http_version 1.1;

        # Preserve the external host AND port. `$host` drops the port, and the
        # UI builds the blob-upload `Location` header from the request Host, so
        # behind a non-default port (e.g. :9999) `$host` produces a Location
        # without the port and pushes fail with a connection error.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # required for Secure cookies

        # Credentials from `docker login` must reach the UI. Passing them is
        # nginx's default; it is spelled out here so that an inherited
        # `proxy_set_header Authorization "";`, an auth_request block or a WAF
        # rule cannot silently break authentication.
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Connection        "";        # keeps upstream keepalive

        # Stream layers instead of buffering each hop to disk.
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_connect_timeout   10s;
        proxy_send_timeout      900s;
        proxy_read_timeout      900s;
        send_timeout            900s;

        # Never cache /v2/. A cached 401 challenge would be replayed to clients
        # whose credentials are perfectly valid, which looks exactly like
        # "logged in, but the pull is unauthorized". Make sure any CDN/WAF in
        # front behaves the same and forwards the Authorization header.
        proxy_cache off;
    }

    # ---- Web UI and /api ----------------------------------------------------
    location / {
        proxy_pass http://registry_ui;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Connection        "";

        proxy_read_timeout 300s;
    }
}