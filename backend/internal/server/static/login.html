<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - Registry UI</title>
    <link rel="icon" href="/uploads/logo.png" />
    <link rel="stylesheet" href="/base.css" />
    <style>
      .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        position: relative;
      }
      .login-bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        opacity: 0.15;
        z-index: 0;
      }
      .login-card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 400px;
        padding: 32px;
        margin: 20px;
        background: var(--panel);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }
      .login-header {
        text-align: center;
        margin-bottom: 32px;
      }
      .login-header h1 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text);
      }
      .login-header p {
        color: var(--muted);
        font-size: 14px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
      }
      .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--input);
        color: var(--text);
        font-size: 14px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .form-group input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
      }
      .login-btn {
        width: 100%;
        padding: 12px 16px;
        background: var(--accent);
        color: white;
        border: 1px solid var(--accent);
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
      }
      .login-btn:hover {
        background: color-mix(in srgb, var(--accent) 80%, black);
        border-color: color-mix(in srgb, var(--accent) 80%, black);
      }
      .login-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .error-message {
        color: #ff5c70;
        font-size: 13px;
        margin-top: 8px;
        text-align: center;
        display: none;
      }
      .error-message.show {
        display: block;
      }
      .theme-toggle {
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-color);
        cursor: pointer;
        font-size: 14px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div class="login-page">
      <div class="login-bg" id="loginBg"></div>
      <button class="theme-toggle" id="themeToggle" type="button">☀️</button>
      <div class="login-card">
        <div class="login-header">
          <h1 id="loginTitle">Registry UI</h1>
          <p id="loginSubtitle">请登录以继续</p>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="login-btn" id="loginBtn">登录</button>
          <div class="error-message" id="errorMsg"></div>
        </form>
      </div>
    </div>

    <script>
      // The theme used to be read from localStorage here while the main app
      // persists it server-side, so the login page could show a theme that
      // disagreed with the app the user lands on. It now comes from
      // /api/settings, with localStorage only as a fallback before that
      // response arrives.
      const titleEl = document.getElementById('loginTitle');
      const subtitleEl = document.getElementById('loginSubtitle');
      const themeBtn = document.getElementById('themeToggle');
      const nextParam = new URLSearchParams(location.search).get('next');

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
        themeBtn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
      }
      applyTheme(localStorage.getItem('theme') || 'dark');

      fetch('/api/settings')
        .then(res => res.ok ? res.json() : null)
        .then(s => {
          if (!s) return;
          const theme = s.theme === 'light' ? 'light' : 'dark';
          localStorage.setItem('theme', theme);
          applyTheme(theme);
          const title = (s.appTitle || '').trim();
          const subtitle = (s.appSubtitle || '').trim();
          if (title) { titleEl.textContent = title; document.title = `${title} - 登录`; }
          if (subtitle) subtitleEl.textContent = subtitle;
        })
        .catch(() => { /* keep the localStorage/default theme */ });

      themeBtn.onclick = () => {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        localStorage.setItem('theme', next);
      };

      // Try to load custom background. A missing file is the common case, so
      // the probe result is cached in sessionStorage to avoid a 404 per visit.
      const bgKey = 'loginBgMissing';
      if (!sessionStorage.getItem(bgKey)) {
        fetch('/uploads/login-bg.jpg', {method: 'GET'})
          .then(res => {
            if (res.ok) document.getElementById('loginBg').style.backgroundImage = 'url(/uploads/login-bg.jpg)';
            else sessionStorage.setItem(bgKey, '1');
          })
          .catch(() => { sessionStorage.setItem(bgKey, '1'); });
      }

      // An authenticated visitor hitting /login.html should land in the app
      // instead of being asked to log in again.
      fetch('/api/user')
        .then(res => res.ok ? res.json() : null)
        .then(u => {
          if (u && u.username) window.location.replace(safeNext());
        })
        .catch(() => { /* stay on the login form */ });

      function safeNext() {
        // Only same-origin relative paths, so ?next= cannot be used as an
        // open redirect.
        if (!nextParam) return '/';
        try {
          const url = new URL(nextParam, location.origin);
          if (url.origin !== location.origin) return '/';
          return url.pathname + url.search;
        } catch { return '/'; }
      }

      // Login form handling
      document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const errorEl = document.getElementById('errorMsg');
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.textContent = '登录中...';
        errorEl.classList.remove('show');

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          if (res.ok) {
            window.location.replace(safeNext());
          } else {
            const data = await res.json().catch(() => ({}));
            errorEl.textContent = data.error || '登录失败，请检查用户名和密码';
            errorEl.classList.add('show');
            btn.disabled = false;
            btn.textContent = '登录';
          }
        } catch (err) {
          errorEl.textContent = '网络错误，请重试';
          errorEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = '登录';
        }
      };
    </script>
  </body>
</html>
